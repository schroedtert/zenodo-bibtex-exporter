[project]
name = "zenodo-bibtex-exporter"
dynamic = ["version"]
authors = [{ name = "Tobias Schrödter" }]
description = "Export BibTeX citation information from Zenodo records."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "requests>=2.32,<3.0",
]

[project.scripts]
zenodo-bibtex = "zenodo_bibtex_exporter.cli:main"

[project.urls]
homepage = "https://github.com/schroedtert/zenodo-bibtex-exporter"
repository = "https://github.com/schroedtert/zenodo-bibtex-exporter"
issues = "https://github.com/schroedtert/zenodo-bibtex-exporter/issues"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/zenodo_bibtex_exporter"]

[tool.uv-dynamic-versioning]
style = "pep440"
pattern = "default"
fallback-version = "0.0.0"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "responses>=0.25",
]

[tool.ruff]
line-length = 120
src = ["src"]
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = [
    # pyflakes
    "F",
    # pycodestyle
    "E", "W",
    # pydocstyle
    "D",
    # isort
    "I",
    # pep8-naming
    "N",
    # flake8-2020
    "YTT",
    # flake8-bugbear
    "B",
    # flake8-quotes
    "Q",
    # flake8-debugger
    "T10",
    # flake8-gettext
    "INT",
    # pylint
    "PL",
    # flake8-pytest-style
    "PT",
    # misc lints
    "PIE",
    # flake8-pyi
    "PYI",
    # tidy imports
    "TID",
    # type-checking imports
    "TC",
    # comprehensions
    "C4",
    # pygrep-hooks
    "PGH",
    # flake8-bandit: exec-builtin
    "S102",
    # Perflint
    "PERF",
    # flynt
    "FLY",
    # flake8-logging-format
    "G",
    # flake8-future-annotations
    "FA",
    # unconventional-import-alias
    "ICN001",
    # flake8-slots
    "SLOT",
    # flake8-raise
    "RSE",
    # flake8-simplify
    "SIM",
    # Ruff-specific rules
    "RUF",
]
ignore = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Tests do not need docstrings, and asserting on literals is the point.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "PLR2004"]

[tool.ruff.lint.isort]
case-sensitive = true
known-first-party = ["zenodo_bibtex_exporter"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
## The Zenodo client takes its configuration as keyword-only arguments.
max-args = 10

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
namespace_packages = true
ignore_missing_imports = false
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not network'"
markers = [
    "network: hits the live Zenodo API; deselected by default, run with -m network",
]

[tool.coverage.run]
source = ["src/zenodo_bibtex_exporter"]
branch = true
## Exercised by a subprocess test, which coverage cannot see.
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
